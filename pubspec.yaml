
name: celyah
description: Celyah Robot V14 companion app
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.3.1
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/celyah_icon.png"
  adaptive_icon_background: "#100B18"
  adaptive_icon_foreground: "assets/icon/celyah_icon.png"

flutter:
  uses-material-design: true
